---
- hosts: servers
  tasks:
    - include_tasks: tasks/nginx.yml

    - name: Ensure custom index page is in place
      copy:
        src: files/index.html
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Ensure app directory exists
      file:
        path: /opt/myapp
        state: directory
        mode: '0755'
